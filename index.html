<title>WrestleTraining – Minuteur</title>
<style>
:root{
  --bg:#12151a; --panel:#1b2027; --line:#2a313b; --txt:#eef0f3; --mute:#8b94a1;
  --gold:#d4a84a; --tech:#3d7bd9; --match:#d9473d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 24px}
.logowrap{position:relative;width:150px;aspect-ratio:200/220;flex:none}
.chrono{position:absolute;inset:0;width:100%;height:100%}
.chrono .cring{fill:#161a20;stroke:var(--gold);stroke-width:3}
.chrono .cring2{fill:none;stroke:var(--line);stroke-width:2}
.chrono .cb{fill:#161a20;stroke:var(--gold);stroke-width:2.5}
.chrono .ts{stroke:var(--mute);stroke-width:1;opacity:.55}
.chrono .tb{stroke:var(--gold);stroke-width:2.5;opacity:.9}
.chrono .hand{stroke:var(--match);stroke-width:2.5;stroke-linecap:round;opacity:.8}
.logo{position:absolute;left:50%;top:54.5%;height:105px;width:auto;transform:translate(-50%,-50%);display:block}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.presets button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:10px 8px;font-size:.9rem;font-weight:600;cursor:pointer}
.presets button.active{border-color:var(--gold);color:var(--gold)}
.presets button:disabled{color:var(--mute);opacity:.5;cursor:default;font-weight:400}
.presets small{display:block;font-weight:400;font-size:.72rem;color:var(--mute);margin-top:2px}
.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 16px;
  text-align:center;transition:border-color .3s}
.card[data-phase="Technique"]{border-color:var(--tech)}
.card[data-phase="Match"]{border-color:var(--match)}
.card[data-phase="Terminé"]{border-color:var(--gold)}
.phase{font-size:1.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-height:1.9rem}
.card[data-phase="Technique"] .phase{color:var(--tech)}
.card[data-phase="Match"] .phase{color:var(--match)}
.card[data-phase="Terminé"] .phase{color:var(--gold)}
.time{font-size:clamp(4.5rem,24vw,6.5rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--gold)}
.step{margin-top:10px;font-size:.85rem;color:var(--mute)}
.card[data-phase="Exercice"]{border-color:var(--match)}
.card[data-phase="Repos"]{border-color:var(--tech)}
.card[data-phase="Exercice"] .phase{color:var(--match)}
.card[data-phase="Repos"] .phase{color:var(--tech)}
.card[data-phase="Lutte"]{border-color:var(--match)}
.card[data-phase="Changement"]{border-color:var(--gold)}
.card[data-phase="Lutte"] .phase{color:var(--match)}
.card[data-phase="Changement"] .phase{color:var(--gold)}
.card[data-phase="Debout"]{border-color:var(--match)}
.card[data-phase="Sol"]{border-color:var(--gold)}
.card[data-phase="Debout"] .phase{color:var(--match)}
.card[data-phase="Sol"] .phase{color:var(--gold)}
.presets button:last-child:nth-child(odd){grid-column:1/-1}
.seq div.L.cur{border-color:var(--match)}
.seq div.E.cur{border-color:var(--match)} .seq div.R.cur{border-color:var(--tech)}
.params{display:flex;flex-direction:column;gap:8px;width:100%;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.params[hidden]{display:none}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prow .ctl{display:flex;align-items:center;gap:8px}
.params button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--txt);font-size:1.3rem;cursor:pointer}
.params span.n{font-size:1.1rem;font-weight:700;min-width:6.5ch;text-align:center;color:var(--gold)}
.controls{display:flex;gap:10px;width:100%}
.controls button{flex:1;padding:15px;font-size:1rem;font-weight:700;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);cursor:pointer}
.controls #main{background:var(--gold);color:#1a1405;border-color:var(--gold);flex:2}
.seq{display:flex;gap:6px;width:100%}
.seq div{flex:1;text-align:center;padding:8px 2px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  font-size:.75rem;color:var(--mute)}
.seq div b{display:block;font-size:1rem;color:var(--txt)}
.seq div.done{opacity:.4}
.seq div.cur{border-color:var(--gold)}
.seq div.T.cur{border-color:var(--tech)} .seq div.M.cur{border-color:var(--match)}
.voice{font-size:.8rem;color:var(--mute);display:flex;align-items:center;gap:8px}
</style>
</head>

<script>
// ---- Programmes ----
// Une phase = { s: durée en secondes, label: texte affiché + annoncé, g: groupe (pour la barre du bas), info: texte sous le chrono }
function italienne(){
  const d=[[3,"Technique"],[1,"Match"],[2,"Technique"],[2,"Match"],[1,"Technique"],[3,"Match"]];
  return {
    phases: d.map((x,i)=>({s:x[0]*60,label:x[1],g:i,info:"Phase "+(i+1)+" / "+d.length})),
    groups: d.map(x=>({t:x[0]+"'",b:x[1]==="Technique"?"Tech.":"Match",c:x[1][0]}))
  };
}
function circuit(n){
  const blocks=[[30,30],[30,30],[20,10],[20,10]], phases=[], groups=[];
  blocks.forEach((bl,i)=>{
    for(let k=1;k<=n;k++){
      const info="Bloc "+(i+1)+" / 4 · Exercice "+k+" / "+n;
      phases.push({s:bl[0],label:"Exercice",g:groups.length,info});
      if(k<n) phases.push({s:bl[1],label:"Repos",g:groups.length,info}); // pas de repos après le dernier exercice du bloc
    }
    groups.push({t:bl[0]+"/"+bl[1],b:"Bloc "+(i+1),c:"E"});
    if(i<blocks.length-1){
      phases.push({s:60,label:"Repos",g:groups.length,info:"Repos entre les blocs"});
      groups.push({t:"1'",b:"Repos",c:"R"});
    }
  });
  return {phases,groups};
}
function libre(ex,rep,nEx,nCyc,repCyc){
  const phases=[], groups=[];
  for(let c=1;c<=nCyc;c++){
    for(let k=1;k<=nEx;k++){
      phases.push({s:ex,label:"Exercice",g:c-1,info:"Cycle "+c+" / "+nCyc+" · Exercice "+k+" / "+nEx});
      if(k<nEx && rep>0) phases.push({s:rep,label:"Repos",g:c-1,info:"Cycle "+c+" / "+nCyc+" · Repos"});
    }
    groups.push({t:String(c),b:nCyc<=6?"Cycle":"",c:"E"});
    if(c<nCyc && repCyc>0) phases.push({s:repCyc,label:"Repos",g:c-1,info:"Repos · prochain cycle "+(c+1)+" / "+nCyc});
  }
  return {phases,groups};
}
function deboutSol(nm,deb,sol,rep){
  const phases=[], groups=[];
  for(let m=1;m<=nm;m++){
    [["Debout",deb],["Sol",sol],["Debout",deb],["Sol",sol]].forEach((x,i)=>{
      phases.push({s:x[1],label:x[0],g:m-1,info:"Match "+m+" / "+nm+" · Période "+(i+1)+" / 4"});
    });
    groups.push({t:String(m),b:nm<=6?"Match":"",c:"L"});
    if(m<nm && rep>0) phases.push({s:rep,label:"Repos",g:m-1,info:"Repos · prochain match "+(m+1)+" / "+nm});
  }
  return {phases,groups};
}
function lutte(n){
  const phases=[], groups=[];
  for(let k=1;k<=n;k++){
    const info="Passage "+k+" / "+n;
    phases.push({s:30,label:"Lutte",g:k-1,info});
    phases.push({s:10,label:"Changement",g:k-1,info});
    phases.push({s:30,label:"Lutte",g:k-1,info});
    groups.push({t:String(k),b:n<=6?"Passage":"",c:"L"});
    if(k<n) phases.push({s:20,label:"Repos",g:k-1,info:"Repos · prochain passage "+(k+1)+" / "+n});
  }
  return {phases,groups};
}
const PRESETS = [
  { name:"Italienne", desc:"3 · 1 · 2 · 2 · 1 · 3 min", build:()=>italienne() },
  { name:"Circuit training", desc:"Tabata", params:[{text:"Nombre d'exercices",min:1,max:20,val:8}], build:v=>circuit(v[0]) },
  { name:"Lutte à thème", desc:"30s · 10s · 30s", params:[{text:"Nombre de passages",min:1,max:15,val:4}], build:v=>lutte(v[0]) },
  { name:"Debout / Sol", desc:"4 périodes par match", params:[
      {text:"Nombre de matchs",min:1,max:15,val:3},
      {text:"Temps debout",min:5,max:600,step:5,val:90,unit:"s"},
      {text:"Temps sol",min:5,max:600,step:5,val:30,unit:"s"},
      {text:"Repos entre matchs",min:0,max:600,step:5,val:120,unit:"s"}
    ], build:v=>deboutSol(v[0],v[1],v[2],v[3]) },
  { name:"Libre", desc:"Réglages libres", params:[
      {text:"Temps d'exercice",min:5,max:600,step:5,val:30,unit:"s"},
      {text:"Repos entre exercices",min:0,max:600,step:5,val:15,unit:"s"},
      {text:"Nombre d'exercices",min:1,max:30,val:6},
      {text:"Nombre de cycles",min:1,max:20,val:3},
      {text:"Repos entre cycles",min:0,max:600,step:5,val:60,unit:"s"}
    ], build:v=>libre(v[0],v[1],v[2],v[3],v[4]) }
];

const $ = id => document.getElementById(id);
let cur=0, idx=0, remaining=0, endAt=0, timer=null, state="idle"; // idle | run | pause | done
let wakeLock=null, PROG=null;

function phases(){ return PROG.phases; }
function fmt(s){ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

let actx=null;
function buzz(){ // corne de brume : tons graves + harmoniques, léger glissando vers le bas
  if(!$("buzzOn").checked) return false;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime, dur=1.0;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.9,t+0.08);
    g.gain.setValueAtTime(0.9,t+dur-0.25);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1100; lp.Q.value=2;
    lp.connect(g); g.connect(actx.destination);
    [[130,0],[130,8],[196,0],[65,0]].forEach(([f,det],i)=>{
      const o=actx.createOscillator(); o.type=i===3?"square":"sawtooth";
      o.frequency.setValueAtTime(f*1.04,t); o.frequency.exponentialRampToValueAtTime(f,t+0.15);
      o.frequency.setValueAtTime(f,t+dur-0.3); o.frequency.exponentialRampToValueAtTime(f*0.93,t+dur);
      o.detune.value=det;
      const og=actx.createGain(); og.gain.value=i===2?0.35:(i===3?0.4:0.6);
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+dur+0.05);
    });
    return true;
  }catch(e){ return false; }
}
function speak(text){
  const b = buzz();
  if(!$("voiceOn").checked || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.toUpperCase()+" !");
  u.lang="fr-FR"; u.rate=1.1; u.pitch=1.6; u.volume=1;
  const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith("fr"));
  if(v) u.voice=v;
  setTimeout(()=>speechSynthesis.speak(u), b?900:0);
}

function buildProg(){ const P=PRESETS[cur]; PROG = P.build(P.params ? P.params.map(q=>q.val) : []); }

function renderPresets(){
  $("presets").innerHTML="";
  PRESETS.forEach((p,i)=>{
    const b=document.createElement("button");
    if(p){ b.innerHTML=p.name+"<small>"+p.desc+"</small>"; b.onclick=()=>selectPreset(i); if(i===cur) b.className="active"; }
    else { b.innerHTML="Programme "+(i+1)+"<small>à définir</small>"; b.disabled=true; }
    $("presets").appendChild(b);
  });
}
function fmtP(q){
  if(q.unit!=="s") return String(q.val);
  const m=Math.floor(q.val/60), r=q.val%60;
  return m ? m+" min"+(r?" "+r:"") : q.val+" s";
}
function changeP(q,d){
  if(state!=="idle") return;
  q.val=Math.min(q.max,Math.max(q.min,q.val+d*(q.step||1)));
  resetAll();
}
function updateParams(){
  const P=PRESETS[cur], box=$("params");
  box.hidden=!(P.params && state==="idle");
  if(box.hidden) return;
  box.innerHTML="";
  P.params.forEach(q=>{
    const row=document.createElement("div"); row.className="prow";
    const lab=document.createElement("span"); lab.textContent=q.text;
    const ctl=document.createElement("div"); ctl.className="ctl";
    const m=document.createElement("button"); m.textContent="−"; m.onclick=()=>changeP(q,-1);
    const n=document.createElement("span"); n.className="n"; n.textContent=fmtP(q);
    const pl=document.createElement("button"); pl.textContent="+"; pl.onclick=()=>changeP(q,1);
    ctl.append(m,n,pl); row.append(lab,ctl); box.appendChild(row);
  });
}
function renderSeq(){
  const gi = (state==="run"||state==="pause") ? phases()[idx].g : -1;
  $("seq").innerHTML = PROG.groups.map((g,i)=>{
    const c = state==="done" || (gi>=0 && i<gi) ? " done" : "";
    const k = i===gi ? " cur" : "";
    return `<div class="${g.c}${c}${k}"><b>${g.t}</b>${g.b}</div>`;
  }).join("");
}
function renderTime(){
  const total=phases()[idx].s;
  $("time").textContent=fmt(remaining);
  $("barfill").style.width=(100*(1-remaining/total))+"%";
}
function setPhaseUI(){
  const p=phases()[idx];
  $("phase").textContent=p.label; $("card").dataset.phase=p.label;
  $("step").textContent=p.info;
  renderSeq();
}

function selectPreset(i){ cur=i; renderPresets(); resetAll(); }

function resetAll(){
  clearInterval(timer); timer=null; state="idle"; idx=0;
  buildProg();
  remaining=phases()[0].s;
  $("phase").textContent="Prêt"; $("card").dataset.phase="";
  $("step").textContent=PRESETS[cur].name+" · "+PRESETS[cur].desc+" · durée "+fmt(PROG.phases.reduce((a,p)=>a+p.s,0));
  $("main").textContent="Démarrer";
  renderTime(); renderSeq(); updateParams(); releaseWake();
  if("speechSynthesis" in window) speechSynthesis.cancel();
}

function startPhase(i){
  idx=i; remaining=phases()[i].s; endAt=Date.now()+remaining*1000;
  setPhaseUI(); renderTime();
  speak(phases()[i].label);
}

function tick(){
  remaining=(endAt-Date.now())/1000;
  if(remaining<=0){
    if(idx+1<phases().length){ if(navigator.vibrate) navigator.vibrate(200); startPhase(idx+1); }
    else finish();
    return;
  }
  renderTime();
}

function finish(){
  clearInterval(timer); timer=null; state="done"; remaining=0;
  $("phase").textContent="Terminé"; $("card").dataset.phase="Terminé";
  $("time").textContent="0:00"; $("barfill").style.width="100%";
  $("step").textContent="Séance terminée"; $("main").textContent="Recommencer";
  renderSeq(); updateParams(); releaseWake();
  if(navigator.vibrate) navigator.vibrate([300,100,300]);
}

async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }

$("main").onclick=()=>{
  if(state==="idle"){ state="run"; updateParams(); keepAwake(); startPhase(0); timer=setInterval(tick,200); $("main").textContent="Pause"; }
  else if(state==="run"){ state="pause"; clearInterval(timer); timer=null; $("main").textContent="Reprendre"; renderSeq();
    if("speechSynthesis" in window) speechSynthesis.cancel(); }
  else if(state==="pause"){ state="run"; endAt=Date.now()+remaining*1000; keepAwake(); timer=setInterval(tick,200); $("main").textContent="Pause"; renderSeq(); }
  else if(state==="done"){ resetAll(); $("main").click(); }
};
$("reset").onclick=resetAll;
document.addEventListener("visibilitychange",()=>{ if(state==="run" && !document.hidden) keepAwake(); });
if("speechSynthesis" in window) speechSynthesis.getVoices();

renderPresets(); resetAll();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} });
}
</script>
